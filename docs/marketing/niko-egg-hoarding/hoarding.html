<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>niko Egg Hoarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Quicksand:wght@700&display=block" rel="stylesheet">
<style>
  /* Egg is 26.8in x 36in (3 ft tall); page adds 0.25in bleed all round. */
  @page { size: 27.3in 36.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 27.3in; height: 36.5in; }
  body.screen svg { width: auto; height: 100vh; margin: 0 auto; }
  .cut { display: none; }
  body.showcut .cut { display: inline; }
</style>
</head>
<body>
<svg viewBox="0 0 2730 3650" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Egg outline in design units (2620 x 3520), scaled up to 36in tall below -->
  <path id="egg" d="M1350,40 C1950,40 2660,1300 2660,2250 C2660,3000 2080,3560 1350,3560 C620,3560 40,3000 40,2250 C40,1300 750,40 1350,40 Z"/>
  <clipPath id="bleed">
    <use href="#egg" transform="translate(1350 1800) scale(1.0195 1.0145) translate(-1350 -1800)"/>
  </clipPath>
  <pattern id="diamonds" width="70" height="70" patternUnits="userSpaceOnUse">
    <path d="M35,0 L70,35 L35,70 L0,35 Z" fill="none" stroke="#000" stroke-opacity=".07" stroke-width="3"/>
  </pattern>
  <pattern id="zig" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M0,22 L22,0 L44,22 Z M0,22 L22,44 L44,22 Z" fill="#fff"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFE08A"/>
    <stop offset="1" stop-color="#F7B733"/>
  </radialGradient>
  <path id="arcTop" d="M-118,0 A118,118 0 0 1 118,0"/>
  <path id="arcBot" d="M-142,0 A142,142 0 0 0 142,0"/>
</defs>

<g transform="translate(25 25) scale(1.0227) translate(-40 -40)">
<g clip-path="url(#bleed)">

  <!-- ===== TOP: golden sunrise with the logo ===== -->
  <rect x="0" y="0" width="2700" height="1340" fill="url(#glow)"/>
  <g transform="translate(1350 880)" fill="#fff" fill-opacity=".18">
    <path id="ray" d="M0,0 L-60,-1600 L60,-1600 Z"/>
    <use href="#ray" transform="rotate(15)"/><use href="#ray" transform="rotate(30)"/>
    <use href="#ray" transform="rotate(45)"/><use href="#ray" transform="rotate(60)"/>
    <use href="#ray" transform="rotate(75)"/><use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(-15)"/><use href="#ray" transform="rotate(-30)"/>
    <use href="#ray" transform="rotate(-45)"/><use href="#ray" transform="rotate(-60)"/>
    <use href="#ray" transform="rotate(-75)"/><use href="#ray" transform="rotate(-90)"/>
  </g>

  <!-- star mark at the crown -->
  <g transform="translate(1350 330)">
    <circle r="92" fill="#CE1126"/>
    <circle r="78" fill="none" stroke="#FFD166" stroke-width="5" stroke-dasharray="10 8"/>
    <path d="M0,-50 L14,-16 L50,-15 L22,8 L31,43 L0,23 L-31,43 L-22,8 L-50,-15 L-14,-16 Z" fill="#FFD166"/>
  </g>

  <!-- niko eggs logo (swap for the original vector logo before printing) -->
  <text x="1350" y="930" text-anchor="middle" font-family="Quicksand" font-weight="700" font-size="560" fill="#CE1126" letter-spacing="-8">niko</text>
  <path d="M760,975 H1940 C1940,1150 1665,1265 1350,1265 C1035,1265 760,1150 760,975 Z" fill="#CE1126"/>
  <text x="1350" y="1165" text-anchor="middle" font-family="Quicksand" font-weight="700" font-size="190" fill="#FFD166">eggs</text>

  <!-- ===== MIDDLE: red, why niko is special ===== -->
  <rect x="0" y="1340" width="2700" height="1810" fill="#CE1126"/>
  <rect x="0" y="1340" width="2700" height="1810" fill="url(#diamonds)"/>
  <rect x="0" y="1318" width="2700" height="44" fill="url(#zig)"/>

  <!-- Export Quality seal, left -->
  <g transform="translate(490 1330) rotate(-8)">
    <circle r="175" fill="#FFD166" stroke="#8E0A17" stroke-width="8"/>
    <circle r="152" fill="none" stroke="#CE1126" stroke-width="4" stroke-dasharray="6 6"/>
    <text y="-52" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="54" fill="#CE1126" letter-spacing="2">EXPORT</text>
    <path transform="translate(0 6)" d="M0,-40 L11,-13 L40,-12 L17,6 L25,35 L0,18 L-25,35 L-17,6 L-40,-12 L-11,-13 Z" fill="#8E0A17"/>
    <text y="100" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="50" fill="#CE1126" letter-spacing="1">QUALITY</text>
  </g>

  <!-- Product of Assam stamp, right -->
  <g transform="translate(2200 1330) rotate(7)">
    <rect x="-150" y="-150" width="300" height="300" fill="#FFD166" stroke="#FFD166" stroke-width="24" stroke-dasharray="0.1 22" stroke-linecap="round"/>
    <rect x="-128" y="-128" width="256" height="256" fill="none" stroke="#8E0A17" stroke-width="6"/>
    <text y="-48" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="50" fill="#8E0A17">PRODUCT</text>
    <text y="10" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="40" fill="#8E0A17">OF</text>
    <text y="82" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="60" fill="#CE1126">ASSAM</text>
  </g>

  <text x="1350" y="1590" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="88" fill="#FFD166" letter-spacing="10">WHAT MAKES</text>
  <text x="1350" y="1745" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="150" fill="#fff"><tspan font-family="Quicksand" font-weight="700" font-size="168">niko</tspan> EGGS SPECIAL?</text>

  <!-- reasons -->
  <g font-family="Poppins">
    <!-- 1 own farm -->
    <g transform="translate(0 1960)">
      <circle cx="560" r="118" fill="#FFD166"/>
      <g transform="translate(560 8)" fill="#CE1126">
        <path d="M-78,-8 L0,-72 L78,-8 L64,-8 L64,62 L-64,62 L-64,-8 Z"/>
        <rect x="-20" y="10" width="40" height="52" rx="6" fill="#FFD166"/>
        <rect x="-50" y="2" width="22" height="22" fill="#FFD166"/>
        <rect x="28" y="2" width="22" height="22" fill="#FFD166"/>
      </g>
      <text x="740" y="-12" font-weight="800" font-size="96" fill="#fff">OUR OWN FARM</text>
      <text x="740" y="66" font-weight="500" font-size="58" fill="#FFE3E6">Laid in Thelamara, Sonitpur — fresh to you</text>
    </g>
    <!-- 2 own feed mill -->
    <g transform="translate(0 2250)">
      <circle cx="560" r="118" fill="#FFD166"/>
      <g transform="translate(560 0)" fill="#CE1126">
        <rect x="-5" y="-30" width="10" height="110" rx="5"/>
        <ellipse cx="0" cy="-62" rx="16" ry="30"/>
        <ellipse cx="-24" cy="-28" rx="14" ry="28" transform="rotate(-35 -24 -28)"/>
        <ellipse cx="24" cy="-28" rx="14" ry="28" transform="rotate(35 24 -28)"/>
        <ellipse cx="-24" cy="10" rx="14" ry="28" transform="rotate(-35 -24 10)"/>
        <ellipse cx="24" cy="10" rx="14" ry="28" transform="rotate(35 24 10)"/>
        <ellipse cx="-24" cy="46" rx="14" ry="26" transform="rotate(-35 -24 46)"/>
        <ellipse cx="24" cy="46" rx="14" ry="26" transform="rotate(35 24 46)"/>
      </g>
      <text x="740" y="-12" font-weight="800" font-size="96" fill="#fff">OUR OWN FEED MILL</text>
      <text x="740" y="66" font-weight="500" font-size="58" fill="#FFE3E6">Every grain tested before it is milled</text>
    </g>
    <!-- 3 comfortable hens -->
    <g transform="translate(0 2540)">
      <circle cx="560" r="118" fill="#FFD166"/>
      <g transform="translate(560 0)" fill="#CE1126">
        <circle r="84" fill="none" stroke="#CE1126" stroke-width="10"/>
        <ellipse cx="0" cy="-38" rx="20" ry="38"/>
        <ellipse cx="0" cy="-38" rx="20" ry="38" transform="rotate(120)"/>
        <ellipse cx="0" cy="-38" rx="20" ry="38" transform="rotate(240)"/>
        <circle r="16" fill="#FFD166" stroke="#CE1126" stroke-width="8"/>
      </g>
      <text x="740" y="-12" font-weight="800" font-size="96" fill="#fff">COOL, HAPPY HENS</text>
      <text x="740" y="66" font-weight="500" font-size="58" fill="#FFE3E6">Climate-controlled houses, day and night</text>
    </g>
    <!-- 4 hygienic -->
    <g transform="translate(0 2830)">
      <circle cx="560" r="118" fill="#FFD166"/>
      <g transform="translate(560 4)">
        <path d="M0,-78 L66,-52 L66,4 C66,46 36,70 0,82 C-36,70 -66,46 -66,4 L-66,-52 Z" fill="#CE1126"/>
        <path d="M-30,2 L-8,26 L32,-22" fill="none" stroke="#FFD166" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="740" y="-12" font-weight="800" font-size="96" fill="#fff">HYGIENIC &amp; GRADED</text>
      <text x="740" y="66" font-weight="500" font-size="58" fill="#FFE3E6">Cleaned, checked and sized before packing</text>
    </g>
  </g>

  <!-- ===== BOTTOM: yellow, contact ===== -->
  <rect x="0" y="3150" width="2700" height="500" fill="#FFD166"/>
  <rect x="0" y="3128" width="2700" height="44" fill="url(#zig)"/>
  <text x="1350" y="3262" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="58" fill="#CE1126" letter-spacing="2">FRESH WHITE TABLE EGGS · HIGH PROTEIN</text>
  <g transform="translate(1350 3355)">
    <rect x="-520" y="-62" width="1040" height="124" rx="62" fill="#CE1126"/>
    <g transform="translate(-410 0)" fill="#FFD166">
      <circle r="44" fill="none" stroke="#FFD166" stroke-width="7"/>
      <path d="M-20,-24 C-26,-10 -18,10 0,22 C10,28 20,26 24,18 L14,6 L4,10 C-4,6 -8,0 -10,-8 L-4,-16 L-14,-28 Z"/>
    </g>
    <text x="40" y="34" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="98" fill="#fff" letter-spacing="2">757 889 3333</text>
  </g>
  <text x="1350" y="3478" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="40" fill="#8E0A17">Amino Farms · Thelamara, Assam</text>
</g>

<!-- cut line (proof only, not printed) -->
<use class="cut" href="#egg" fill="none" stroke="#FF00FF" stroke-width="5" stroke-dasharray="20 12"/>
</g>
</svg>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('cut')) document.body.classList.add('showcut');
  if (q.has('screen')) document.body.classList.add('screen');
</script>
</body>
</html>
