<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>niko</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <script>
      // Before first paint, or the app flashes the default accent on every load.
      // Yolk is the stylesheet's own :root palette, so it carries no attribute.
      // The pattern test keeps a hand-edited value from writing anything odd
      // into the attribute; an unknown-but-clean name simply matches no rule.
      var a = localStorage.getItem("niko.accent");
      if (a && a !== "yolk" && /^[a-z]+$/.test(a))
        document.documentElement.setAttribute("data-accent", a);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
