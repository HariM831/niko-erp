# nginx for niko — TLS termination and a reverse proxy, nothing more.
#
# The Node process serves the built client itself, so nginx does not need to
# know a single one of the app's routes: no try_files, no SPA rewrite rule to
# keep in step with the router. Everything goes to the app.
#
# This file is HTTP only, on purpose. nginx refuses to start with an ssl
# listener and no certificate, so the 443 blocks cannot exist before the
# certificates do — a config shipped with them commented out is a config that
# fails `nginx -t` the first time somebody uncomments half of it. Instead,
# certbot rewrites this file and adds the TLS server blocks itself, including
# the port 80 redirect, once it has issued the certificates.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/niko
#   sudo sed -i 's/aminofarms\.com/yourdomain.com/g' /etc/nginx/sites-available/niko
#   sudo ln -sf /etc/nginx/sites-available/niko /etc/nginx/sites-enabled/niko
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then, once both names resolve to this box:
#   sudo certbot --nginx -d niko.aminofarms.com -d staging.aminofarms.com
#
# Until that runs the app will not work — not merely be insecure. In
# production the session cookie is marked Secure, so over plain HTTP the
# browser is never given one and nobody can stay logged in.

upstream niko_prod    { server 127.0.0.1:3000; keepalive 16; }
upstream niko_staging { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name niko.aminofarms.com;

    # Device photos and bill scans are posted whole; the default 1m rejects
    # them. The app's own parser caps /api/device at 25mb, so this matches.
    client_max_body_size 25m;

    access_log /var/log/nginx/niko.access.log;
    error_log  /var/log/nginx/niko.error.log;

    location / {
        proxy_pass http://niko_prod;
        proxy_http_version 1.1;

        # The app sets `trust proxy` and marks session cookies Secure in
        # production, so it has to be told the request arrived over TLS —
        # without X-Forwarded-Proto it would see plain http and refuse to
        # set the cookie, and nobody could stay logged in.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A payroll run or a long report can outlast the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.aminofarms.com;

    client_max_body_size 25m;

    # Staging holds a copy of the real books. Scrubbed of bank details, but
    # still every vendor, every invoice, every wage. Keep it off the open
    # internet — uncomment and set your own address.
    # allow 203.0.113.4;
    # deny all;

    # Belt and braces against a search engine finding it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/niko-staging.access.log;
    error_log  /var/log/nginx/niko-staging.error.log;

    location / {
        proxy_pass http://niko_staging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
