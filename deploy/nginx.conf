# HTTP only. certbot --nginx rewrites this file to add the TLS blocks once
# the certificates exist; 443 cannot be configured before then, because nginx
# refuses to start with an ssl listener and no certificate.

upstream niko_prod    { server 127.0.0.1:3000; keepalive 16; }
upstream niko_staging { server 127.0.0.1:3001; keepalive 16; }

server {
    server_name aminofarms.com;

    client_max_body_size 25m;
    access_log /var/log/nginx/niko.access.log;
    error_log  /var/log/nginx/niko.error.log;

    location / {
        proxy_pass http://niko_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/niko.aminofarms.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/niko.aminofarms.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    # The old home and the www alias. Sessions are per-host, so serving the
    # app on three names would mean three logins; one canonical name instead.
    server_name niko.aminofarms.com www.aminofarms.com;
    return 301 https://aminofarms.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/niko.aminofarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niko.aminofarms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name staging.aminofarms.com;

    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/niko-staging.access.log;
    error_log  /var/log/nginx/niko-staging.error.log;

    location / {
        proxy_pass http://niko_staging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/niko.aminofarms.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/niko.aminofarms.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    listen 80;
    listen [::]:80;
    server_name aminofarms.com www.aminofarms.com niko.aminofarms.com;
    return 301 https://aminofarms.com$request_uri;
}

server {
    if ($host = staging.aminofarms.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name staging.aminofarms.com;
    return 404; # managed by Certbot


}